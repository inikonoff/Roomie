name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Empty when the secrets aren't set (forks, a repo that hasn't configured them yet); the build
      # then signs release with the debug key — see app/build.gradle.kts.
      CULLECT_KEYSTORE_PASSWORD: ${{ secrets.CULLECT_KEYSTORE_PASSWORD }}
      CULLECT_KEY_ALIAS: ${{ secrets.CULLECT_KEY_ALIAS }}
      CULLECT_KEY_PASSWORD: ${{ secrets.CULLECT_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses
        # android-actions/setup-android@v3 also tries to install the long-deprecated legacy
        # "tools" package, which Google's repository has stopped serving — it now fails the whole
        # job before our code ever builds. ubuntu-latest already ships a usable SDK at
        # $ANDROID_HOME; all that's actually needed is accepting its licenses.
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore the Play upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CULLECT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "CULLECT_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No upload keystore secret — release builds fall back to the debug key."
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK
        # Signed with the upload key when the secrets exist, else the debug key (see
        # app/build.gradle.kts) — either way a release-optimized binary for on-device measurement.
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Build release bundle (AAB)
        # The format Google Play takes. Only publishable when the upload keystore secrets are set.
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Print resolved versions of the suspect native-lib dependencies
        run: |
          ./gradlew -q :app:dependencies --configuration debugRuntimeClasspath 2>/dev/null \
            | grep -iE "datastore-core|datastore-preferences|graphics-path|graphics-shapes" | sort -u || true

      - name: Check native library page-size alignment (16 KB)
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          WORKDIR=$(mktemp -d)
          if ! unzip -q "$APK" 'lib/*' -d "$WORKDIR"; then
            echo "No native libraries in the APK."
            exit 0
          fi
          echo "ELF LOAD segments per .so — last column is Align; need >= 0x4000 for 16 KB support:"
          find "$WORKDIR" -name '*.so' | while read -r so; do
            echo "--- ${so#"$WORKDIR"/} ---"
            readelf -lW "$so" | grep LOAD
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cullect-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cullect-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload release bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: cullect-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
