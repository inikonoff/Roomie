name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APKs (app + minimal probe)
        run: ./gradlew :app:assembleDebug :probe:assembleDebug --no-daemon

      - name: Print resolved versions of the suspect native-lib dependencies
        run: |
          ./gradlew -q :app:dependencies --configuration debugRuntimeClasspath 2>/dev/null \
            | grep -iE "datastore-core|datastore-preferences|graphics-path|graphics-shapes" | sort -u || true

      - name: Check native library page-size alignment (16 KB)
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          WORKDIR=$(mktemp -d)
          if ! unzip -q "$APK" 'lib/*' -d "$WORKDIR"; then
            echo "No native libraries in the APK."
            exit 0
          fi
          echo "ELF LOAD segments per .so — last column is Align; need >= 0x4000 for 16 KB support:"
          find "$WORKDIR" -name '*.so' | while read -r so; do
            echo "--- ${so#"$WORKDIR"/} ---"
            readelf -lW "$so" | grep LOAD
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roomie-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload probe APK
        uses: actions/upload-artifact@v4
        with:
          name: roomie-probe-debug-apk
          path: probe/build/outputs/apk/debug/probe-debug.apk
          if-no-files-found: error
